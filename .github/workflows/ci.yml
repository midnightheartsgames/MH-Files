# Проверка и сборка (PLAN.md §11).
#
# Правила цепочки поставок — как в MH Monitoring:
# * сторонние действия закреплены по SHA коммита, а не по тегу;
# * у токена только чтение, checkout не оставляет его в .git;
# * всё собирается с --locked — ровно те версии, что в Cargo.lock.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Формат
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Тесты
        run: cargo test --workspace --locked --no-fail-fast

  linux:
    # Модель и воркеры переносимы: их тесты гоняются и здесь, а интерфейс должен собираться.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Тесты
        run: cargo test --workspace --locked --no-fail-fast

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo-deny
        run: cargo install cargo-deny --version $CARGO_DENY_VERSION --locked

      - name: Уязвимости, отозванные версии, источники, лицензии
        run: cargo deny --locked check

  release:
    needs: [windows, linux, supply-chain]
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Inno Setup
        # На образах windows-latest он обычно уже есть; нет — ставится из Chocolatey.
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: "Сборка: exe, установщик, переносная версия"
        run: .\tools\build-release.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MH-Files-${{ github.sha }}
          path: target/dist/
          if-no-files-found: error

  publish:
    # Выпуск на GitHub Releases: на main, когда для версии из Cargo.toml ещё нет выпуска
    # v<версия>. Тег ставится на этот коммит; версия с `-` (rc, beta) — пред-выпуск.
    # Заметки — docs/releases/<версия>.md: без них выпуск не публикуется.
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Версия
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Выпуск v$version уже есть — пропуск"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            test -f "docs/releases/$version.md" || { echo "::error::нет docs/releases/$version.md"; exit 1; }
          fi

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: steps.version.outputs.exists != 'true'
        with:
          name: MH-Files-${{ github.sha }}
          path: dist

      - name: Выпуск
        if: steps.version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist
          files=("MH-Files-$VERSION-setup.exe" "MH-Files-$VERSION-portable.zip")
          ls -l "${files[@]}"
          sha256sum "${files[@]}" > SHA256SUMS.txt
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "v$VERSION" "${files[@]}" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "MH Files $VERSION" \
            --notes-file "../docs/releases/$VERSION.md" \
            "${prerelease[@]}"
