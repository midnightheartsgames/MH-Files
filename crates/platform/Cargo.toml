[package]
name = "mh-files-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MH Files: Windows Shell, COM и Win32 за безопасным API. Вне Windows — упрощённые заглушки."

[dependencies]
crossbeam-channel.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

# Макрос `windows::core::implement` ссылается на `::windows_core` — крейт нужен напрямую,
# версия та же, что у `windows`.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"
