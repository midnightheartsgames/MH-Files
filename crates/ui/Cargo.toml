[package]
name = "mh-files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MH Files — файловый менеджер для Windows"
build = "build.rs"

[[bin]]
name = "MH-Files"
path = "src/main.rs"

[dependencies]
mh-files-core.workspace = true
mh-files-fs.workspace = true
mh-files-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
lru.workspace = true
eframe.workspace = true
raw-window-handle.workspace = true

# Под Linux программа собирается только для разработки и проверки интерфейса.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
